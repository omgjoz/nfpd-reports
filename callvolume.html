                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-password").addEventListener("input", function () { document.getElementById("pw-error").classList.add("hidden"); this.classList.remove("bad"); });
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = true; // always remember (365 days, set at build time)

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                var errEl = document.getElementById("pw-error"), pwEl = document.getElementById("staticrypt-password");
                if (!isSuccessful) {
                    errEl.classList.remove("hidden"); pwEl.classList.add("bad"); pwEl.select(); pwEl.focus();
                } else { errEl.classList.add("hidden"); }
            });
        </script></body></html>
